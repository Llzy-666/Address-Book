<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通讯录 · 极限编程作业</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-header__title">
        <svg class="app-header__logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h9a3 3 0 0 1 3 3v15l-4-2-4 2-4-2V6a3 3 0 0 1 3-3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="12" cy="9.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8.6 15.2c.7-1.4 2-2.2 3.4-2.2s2.7.8 3.4 2.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        通讯录
      </h1>

      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" class="search__input" type="search"
               placeholder="搜索姓名、公司、备注或联系方式" aria-label="搜索联系人">
      </div>

      <div class="app-header__actions">
        <button id="btnCreate" class="btn btn--primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          新增
        </button>
        <button id="btnImport" class="btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          导入
        </button>
        <button id="btnExport" class="btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          导出
        </button>
        <button id="btnTemplate" class="btn btn--ghost" type="button">下载模板</button>
      </div>
    </div>

    <div class="app-subbar">
      <div class="segmented" role="group" aria-label="联系人筛选">
        <button class="segmented__item is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="segmented__item" type="button" data-filter="favorite" aria-pressed="false">只看收藏</button>
      </div>
      <span class="app-subbar__count" id="countLabel"></span>
    </div>
  </header>

  <main class="app-main">
    <section id="contactGrid" class="contact-grid" aria-live="polite" aria-busy="false"></section>

    <section id="emptyState" class="empty-state" hidden>
      <svg class="empty-state__art" viewBox="0 0 160 120" aria-hidden="true">
        <rect x="26" y="20" width="108" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <rect x="26" y="20" width="108" height="20" rx="10" fill="#eef2ff"/>
        <circle cx="58" cy="62" r="13" fill="#e0e7ff"/>
        <path d="M46 82c2.5-7 7-10 12-10s9.5 3 12 10" fill="#c7d2fe"/>
        <rect x="86" y="54" width="34" height="6" rx="3" fill="#e2e8f0"/>
        <rect x="86" y="68" width="26" height="6" rx="3" fill="#e2e8f0"/>
        <circle cx="126" cy="94" r="12" fill="#2563eb"/>
        <path d="M126 88v12M120 94h12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h2 class="empty-state__title">还没有联系人</h2>
      <p class="empty-state__text">点右上角「新增」把第一个联系人加进来吧。</p>
    </section>
  </main>

  <!-- 新增 / 编辑抽屉 -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__mask" data-close-drawer></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <header class="drawer__header">
        <h2 id="drawerTitle" class="drawer__title">新增联系人</h2>
        <button class="icon-btn" type="button" data-close-drawer aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </header>

      <form class="drawer__body" id="contactForm" novalidate>
        <div class="field">
          <label class="field__label" for="inputName">姓名 <span class="field__required">*</span></label>
          <input id="inputName" class="input" type="text" maxlength="50" autocomplete="off" placeholder="例如：张三">
        </div>

        <div class="field">
          <label class="field__label" for="inputCompany">公司</label>
          <input id="inputCompany" class="input" type="text" maxlength="100" autocomplete="off" placeholder="例如：福州某科技有限公司">
        </div>

        <div class="field">
          <label class="field__label" for="inputNote">备注</label>
          <textarea id="inputNote" class="input input--textarea" rows="2" maxlength="200" placeholder="例如：大学同学，做后端的"></textarea>
        </div>

        <div class="field field--switch">
          <div>
            <span class="field__label">收藏这个联系人</span>
            <p class="field__hint">收藏后会出现在「只看收藏」里，并在卡片左侧显示强调色条。</p>
          </div>
          <label class="switch">
            <input id="inputFavorite" type="checkbox">
            <span class="switch__track"><span class="switch__thumb"></span></span>
          </label>
        </div>

        <div class="field">
          <div class="field__head">
            <span class="field__label">联系方式</span>
            <span class="field__hint">至少填一条</span>
          </div>
          <div id="methodList" class="method-list"></div>
          <button id="btnAddMethod" class="btn btn--dashed" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            添加一条联系方式
          </button>
        </div>

        <p id="formError" class="form-error" role="alert" hidden></p>
      </form>

      <footer class="drawer__footer">
        <button class="btn" type="button" data-close-drawer>取消</button>
        <button id="btnSave" class="btn btn--primary" type="submit" form="contactForm">保存</button>
      </footer>
    </aside>
  </div>

  <!-- 导入面板 -->
  <div class="modal" id="importModal" hidden>
    <div class="modal__mask" data-close-import></div>
    <div class="modal__panel modal__panel--wide" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <header class="modal__header">
        <h2 id="importTitle" class="modal__title">导入联系人</h2>
        <button class="icon-btn" type="button" data-close-import aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="modal__body">
        <ol class="steps">
          <li>先点右侧「下载模板」，得到含固定表头的 xlsx 文件。</li>
          <li>按模板填写：姓名必填，是否收藏只能填「是」或「否」，空单元格会被跳过。</li>
          <li>保存后在这里选择该文件导入，一次上传整批写入。</li>
        </ol>

        <div class="import-drop">
          <input id="importFile" class="import-drop__input" type="file" accept=".xlsx"
                 aria-label="选择要导入的 xlsx 文件">
          <label for="importFile" class="import-drop__label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5m0 0L8 9m4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span id="importFileName">点击选择 .xlsx 文件</span>
          </label>
        </div>

        <div id="importResult" class="import-result" hidden></div>
      </div>

      <footer class="modal__footer">
        <button class="btn" type="button" id="btnDownloadTemplate">下载模板</button>
        <button class="btn btn--primary" type="button" id="btnDoImport">开始导入</button>
      </footer>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal__mask" data-close-confirm></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <header class="modal__header">
        <h2 id="confirmTitle" class="modal__title">确认删除</h2>
      </header>
      <div class="modal__body">
        <p class="confirm__text">确定要删除 <strong id="confirmName"></strong> 吗？该联系人的所有联系方式会一起删除，且无法恢复。</p>
      </div>
      <footer class="modal__footer">
        <button class="btn" type="button" data-close-confirm>取消</button>
        <button class="btn btn--danger" type="button" id="btnConfirmDelete">删除</button>
      </footer>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
